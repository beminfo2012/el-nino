<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz e Mapa - Assistência Social | Defesa Civil SMJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            background-color: #F8FAFC;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header-bar {
            background: linear-gradient(90deg, #6D28D9, #8B5CF6);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .header-bar h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Mapa à esquerda */
        .map-section {
            flex: 1;
            position: relative;
            border-right: 1px solid #E2E8F0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Matriz (Tabela) à direita */
        .matrix-section {
            width: 45%;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .matrix-header {
            padding: 16px 24px;
            border-bottom: 1px solid #E2E8F0;
            background: #F8FAFC;
        }

        .matrix-header h2 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #1E293B;
        }

        .filter-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-input:focus {
            border-color: #8B5CF6;
        }

        .matrix-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            position: sticky;
            top: 0;
            background: #F1F5F9;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748B;
            border-bottom: 2px solid #E2E8F0;
            z-index: 5;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #F1F5F9;
            font-size: 0.85rem;
            color: #334155;
            vertical-align: top;
        }

        @media (max-width: 768px) {
            .header-bar { padding: 12px 16px; }
            .header-bar h1 { font-size: 1rem; }
            .main-container { flex-direction: column; height: auto; overflow: visible; }
            .map-section { height: 350px; flex: none; border-right: none; border-bottom: 1px solid #E2E8F0; }
            .matrix-section { width: 100%; flex: none; height: auto; }
        }

        .data-table tbody tr {
            transition: background 0.15s;
            cursor: pointer;
        }

        .data-table tbody tr:hover {
            background: #F8FAFC;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge.alto { background: #FEE2E2; color: #991B1B; }
        .badge.medio { background: #FEF3C7; color: #92400E; }
        .badge.baixo { background: #DCFCE7; color: #166534; }
        .badge.none { background: #F1F5F9; color: #64748B; }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            font-weight: 600;
            color: #6D28D9;
        }

        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }
            .map-section {
                flex: none;
                height: 40vh;
                border-right: none;
                border-bottom: 1px solid #E2E8F0;
            }
            .matrix-section {
                width: 100%;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>
            <span>🛡️</span>
            Matriz de Assistência Social (El Niño 26/27)
        </h1>
        <a href="/" class="back-btn">Voltar ao Painel</a>
    </div>

    <div class="main-container">
        <!-- Mapa Interativo -->
        <div class="map-section">
            <div id="loading" class="loading-overlay">Carregando mapa e dados...</div>
            <div id="map"></div>
        </div>

        <!-- Matriz Tabela -->
        <div class="matrix-section">
            <div class="matrix-header">
                <h2>Edificações e Risco</h2>
                <input type="text" id="searchInput" class="filter-input" placeholder="Buscar localidade, código ou risco...">
            </div>
            <div class="matrix-body">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th>Localidade</th>
                            <th>Uso</th>
                            <th>Risco Geol.</th>
                            <th>Risco Hidro.</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Linhas geradas via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts Leaflet e Omnivore (para KMZ/KML se necessário) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script src="/static/assistencia.js"></script>
</body>
</html>
